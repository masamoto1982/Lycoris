[package]
name = "ajisai-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
# The browser bindings (`src/wasm.rs`). The native build and `cargo test`
# never pull in wasm-bindgen; `scripts/rebuild-wasm.sh` turns this on.
wasm = [
  "dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
