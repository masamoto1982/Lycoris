name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test --all-targets

      - name: WASM bindings compile
        working-directory: rust
        run: cargo clippy --target wasm32-unknown-unknown --features wasm -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1

      - name: Detect stale committed wasm bundle (advisory)
        # Build the bundle the way the deploy workflow does and compare it
        # with the committed copy. Advisory only: the deploy rebuilds before
        # publishing, so production stays fresh. The warning tells a reviewer
        # that `npm run build:wasm` is needed for local dev to match.
        continue-on-error: true
        run: |
          set -e
          bash ./scripts/install-wasm-pack.sh
          bash ./scripts/rebuild-wasm.sh > /tmp/rebuild-wasm.log 2>&1 || {
            cat /tmp/rebuild-wasm.log
            echo "::warning::wasm rebuild failed during stale-bundle check; skipping diff."
            exit 0
          }
          if ! git diff --quiet -- src/wasm/generated/; then
            echo "::warning::Committed src/wasm/generated/ bundle is stale relative to the Rust source."
            echo "::warning::Run \`npm run build:wasm\` and commit the result so local dev matches production."
            git --no-pager diff --stat -- src/wasm/generated/
          else
            echo "Committed wasm bundle matches a fresh build."
          fi

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Playground colours meet WCAG contrast
        run: npm run check:contrast

      - name: Vite build
        run: npm run build
