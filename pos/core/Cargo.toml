[package]
name = "lycoris-pos-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic core of the Lycoris semi-self POS simulator"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
# The wasm-bindgen boundary is opt-in so `cargo test` stays a plain native
# build, mirroring the Ajisai crate layout.
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
